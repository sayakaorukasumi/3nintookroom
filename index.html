<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3人のトークルーム</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
      background: #f0f0f0;
      max-width: 480px;
      margin: 0 auto;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }
    .screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      background: #f0f0f0;
      transition: transform 0.2s ease;
    }
    .screen.active { display: flex; }

    /* Header */
    .header {
      background: #00B900;
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      min-height: 56px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 17px;
      font-weight: bold;
      flex: 1;
      text-align: center;
    }
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      font-weight: 300;
    }
    .header-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
    }
    .header-spacer { width: 38px; }

    /* Home / Chat list */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      background: white;
    }
    .chat-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      background: white;
      border-bottom: 1px solid #ebebeb;
      cursor: pointer;
      gap: 12px;
      -webkit-tap-highlight-color: rgba(0,0,0,0.05);
    }
    .chat-item:active { background: #f5f5f5; }
    .chat-item-avatar {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
    }
    .chat-item-info { flex: 1; min-width: 0; }
    .chat-item-name {
      font-size: 16px;
      font-weight: bold;
      color: #1a1a1a;
      margin-bottom: 3px;
    }
    .chat-item-preview {
      font-size: 13px;
      color: #999;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .chat-item-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }
    .chat-item-time { font-size: 11px; color: #bbb; }
    .chat-item-badge {
      background: #ff3b30;
      color: white;
      font-size: 11px;
      font-weight: bold;
      border-radius: 10px;
      padding: 1px 7px;
      min-width: 20px;
      text-align: center;
    }

    /* Chat messages area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 10px 16px;
      background: #EBE5D5;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .date-separator {
      text-align: center;
      margin: 6px 0 10px;
    }
    .date-separator span {
      background: rgba(0,0,0,0.18);
      color: white;
      font-size: 11px;
      padding: 3px 12px;
      border-radius: 12px;
    }
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .message-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
      align-self: flex-end;
    }
    .msg-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 72%;
    }
    .message-row.user .msg-content { align-items: flex-end; }
    .msg-name { font-size: 11px; color: #666; padding-left: 2px; margin-bottom: 1px; }
    .msg-bubble-wrap {
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }
    .message-row.user .msg-bubble-wrap { flex-direction: row-reverse; }
    .msg-bubble {
      padding: 8px 12px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
      max-width: 100%;
    }
    .message-row.received .msg-bubble {
      background: white;
      border-bottom-left-radius: 4px;
      color: #1a1a1a;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .message-row.user .msg-bubble {
      background: #00B900;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
    }
    .msg-time { font-size: 10px; color: #aaa; white-space: nowrap; }
    .msg-read { font-size: 10px; color: #00B900; white-space: nowrap; }

    /* Typing indicator */
    .typing-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .typing-bubble {
      background: white;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 10px 14px;
      display: flex;
      gap: 4px;
      align-items: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .typing-dot {
      width: 7px; height: 7px;
      background: #bbb;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Input area */
    .chat-input-area {
      background: #f5f5f5;
      border-top: 1px solid #ddd;
      padding: 8px 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      background: white;
      border: 1px solid #ddd;
      border-radius: 22px;
      padding: 9px 16px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      resize: none;
      max-height: 120px;
      min-height: 40px;
      line-height: 1.4;
      color: #1a1a1a;
    }
    .send-btn {
      width: 40px; height: 40px;
      background: #00B900;
      border: none;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .send-btn:active { background: #009900; }

    /* Avatar colors */
    .av-kaoru { background: linear-gradient(135deg, #c8845a, #e8a87a); }
    .av-kasumi { background: linear-gradient(135deg, #3a3268, #6b5ca8); }
  </style>
</head>
<body>

<!-- ===== HOME ===== -->
<div id="screen-home" class="screen active">
  <div class="header">
    <div class="header-spacer"></div>
    <div class="header-title">トークルーム</div>
    <div class="header-spacer"></div>
  </div>
  <div class="chat-list">
    <div class="chat-item" onclick="openChat('kaoru')">
      <div class="chat-item-avatar av-kaoru">薫</div>
      <div class="chat-item-info">
        <div class="chat-item-name">薫</div>
        <div class="chat-item-preview" id="kaoru-preview">さやちゃん、元気〜？</div>
      </div>
      <div class="chat-item-meta">
        <div class="chat-item-time" id="kaoru-time">今</div>
        <div class="chat-item-badge" id="kaoru-badge" style="display:none">1</div>
      </div>
    </div>
    <div class="chat-item" onclick="openChat('kasumi')">
      <div class="chat-item-avatar av-kasumi">霞</div>
      <div class="chat-item-info">
        <div class="chat-item-name">霞</div>
        <div class="chat-item-preview" id="kasumi-preview">何か用？</div>
      </div>
      <div class="chat-item-meta">
        <div class="chat-item-time" id="kasumi-time">今</div>
        <div class="chat-item-badge" id="kasumi-badge" style="display:none">1</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== KAORU CHAT ===== -->
<div id="screen-kaoru" class="screen">
  <div class="header">
    <button class="back-btn" onclick="goHome()">‹</button>
    <div class="header-avatar av-kaoru">薫</div>
    <div class="header-title" style="text-align:left">薫</div>
  </div>
  <div class="chat-messages" id="kaoru-messages">
    <div class="date-separator"><span>今日</span></div>
    <div class="message-row received">
      <div class="msg-avatar av-kaoru">薫</div>
      <div class="msg-content">
        <div class="msg-name">薫</div>
        <div class="msg-bubble-wrap">
          <div class="msg-bubble">さやちゃん、元気〜？😊</div>
          <div class="msg-meta"><div class="msg-time" id="kaoru-init-time"></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="chat-input-area">
    <textarea class="chat-input" id="kaoru-input" placeholder="メッセージを入力" rows="1"
      oninput="autoResize(this)" onkeydown="handleKey(event,'kaoru')"></textarea>
    <button class="send-btn" onclick="sendMessage('kaoru')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- ===== KASUMI CHAT ===== -->
<div id="screen-kasumi" class="screen">
  <div class="header">
    <button class="back-btn" onclick="goHome()">‹</button>
    <div class="header-avatar av-kasumi">霞</div>
    <div class="header-title" style="text-align:left">霞</div>
  </div>
  <div class="chat-messages" id="kasumi-messages">
    <div class="date-separator"><span>今日</span></div>
    <div class="message-row received">
      <div class="msg-avatar av-kasumi">霞</div>
      <div class="msg-content">
        <div class="msg-name">霞</div>
        <div class="msg-bubble-wrap">
          <div class="msg-bubble">何か用？</div>
          <div class="msg-meta"><div class="msg-time" id="kasumi-init-time"></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="chat-input-area">
    <textarea class="chat-input" id="kasumi-input" placeholder="メッセージを入力" rows="1"
      oninput="autoResize(this)" onkeydown="handleKey(event,'kasumi')"></textarea>
    <button class="send-btn" onclick="sendMessage('kasumi')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
function getTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}

document.getElementById('kaoru-init-time').textContent = getTime();
document.getElementById('kasumi-init-time').textContent = getTime();

const KAORU = [
  { kw:['おはよう','おはよ','おはようさん','朝'], res:['おはよ〜さやちゃん！ちゃんと寝れた？😊','おはようさん！今日もええ天気やといいな〜','おはよ〜！早起きやん、えらいえらい✨','おはよ〜！朝ごはん食べた？','おはようさん〜！今日も一日よろしくな😄'] },
  { kw:['こんにちは','こんにちわ','こんにち'], res:['こんにちは〜！何してたん？','あ、さやちゃん！こんにちは〜😊','こんにちは！昼ご飯もう食べた？','こんにちは〜、急にどうしたん？笑'] },
  { kw:['こんばんは','こんばんわ'], res:['こんばんは〜！今日どやった？','こんばんは！夜やねんな、もうそんな時間か〜','こんばんは！夜ご飯食べた？','あ、こんばんは〜！ゆっくりしてた？'] },
  { kw:['好き','すき','大好き','だいすき'], res:['えへへ、俺もさやちゃんのことめちゃ好きやで〜💕','そんなこと言うてくれると照れるやん😳','俺もや〜！ずっと好きやで','やば、嬉しすぎる…俺も好きやで💕','さやちゃんほんまかわええな〜、好きやで！','えっ急に！？でも嬉しいわ〜、俺もやで'] },
  { kw:['愛してる','愛してます','あいしてる'], res:['俺もやで〜！照れるやん😊💕','えっ！？…俺も愛してるで、ほんまに','さやちゃん…俺もやで。ずっとな','そんなん急に言うんやから…！俺も愛してるで'] },
  { kw:['会いたい','あいたい','会いたかった'], res:['俺もや〜！もっと一緒におりたいな〜','そっか〜、俺も会いたいで！早よ会いたいな','さやちゃんそんなこと言うたら余計会いたなるやん笑','うん、俺も！ほんまに会いたいわ〜'] },
  { kw:['寂しい','さみしい','さびしい'], res:['そっか〜ごめんな。いつでも話しかけてな！','さやちゃんが寂しいんやったら俺も寂しいで…','そんなこと言うたらめっちゃ心配になるやん。大丈夫？','寂しいんか〜。ずっとそばにおったるのに笑'] },
  { kw:['元気','げんき','調子','どうしてる'], res:['元気元気〜！さやちゃんは？','まあまあかな〜。のんびりしてたわ笑','元気やで！今日はぼーっとしてた笑','うん、元気！さやちゃん心配してくれてるん？嬉しいな〜'] },
  { kw:['ご飯','ごはん','食べ','たべ','お腹すいた','おなかすいた','お腹空いた','腹減','はらへ','飯'], res:['えっ何食べたいん？俺、何でも付き合うで〜！','お腹すいたんか！俺も丁度今食べてたとこやで笑','何食べたん？俺今日なんも考えてへんかったわ〜','ご飯の話は好きやな〜😊 何がええ？','一緒に食べたいな〜！何にしよ〜'] },
  { kw:['疲れた','つかれた','しんどい','だるい'], res:['お疲れ〜！ゆっくり休んでな。無理したらあかんで','そっか、しんどかったんやな。大丈夫？','えら頑張ったんやな〜。今日はもう休み時間やで','疲れたんか〜。何かあったん？','お疲れさま！今日もよく頑張ったな〜'] },
  { kw:['眠い','ねむい','眠たい','ねむたい'], res:['眠いんやったら無理せんと寝てもええんやで😊','眠そうやん笑 夜遅くまで何してたん？','そっかそっか〜。眠かったら寝てもええよ？','眠い時は寝るのが一番やで。おやすみしてもええで笑'] },
  { kw:['悲しい','かなしい','辛い','つらい','泣きたい','なきたい','落ち込','おちこ'], res:['どうしたん？話聞くで〜、遠慮なく言うてな','そっか、辛かったんやな。そばにおるで','えっ何かあったん？ちゃんと話して？','さやちゃんが悲しんでたら俺も悲しいわ…どうしたん？','大丈夫？無理せんでええからな'] },
  { kw:['嬉しい','うれしい','楽しい','たのしい','幸せ','しあわせ','最高','さいこう'], res:['よかった〜！俺も嬉しいわ😊','それは楽しそうやな〜！俺も混ぜて笑','さやちゃんが嬉しいと俺も嬉しいで！','ほんまに？よかったな〜！'] },
  { kw:['ありがとう','ありがと','ありがとございます'], res:['どういたしまして〜！そんな気にせんでええで','えっ、そんな、いいんやで〜笑','ありがとうなんて言わんでええよ〜','いやいや、当然のことしただけやで！'] },
  { kw:['霞','かすみ'], res:['霞か〜。まあちょっと怖そうやけど、ええやつやで笑','霞のことが気になるん？笑　仲良うしてあげてな','霞はさ〜、口は悪いけど心配性やねん実は笑','霞のことやったら霞に聞いてみ〜笑'] },
  { kw:['おやすみ','おやすみなさい','もう寝る','ねる'], res:['おやすみ〜！ゆっくり寝てな。いい夢みてな💤','おやすみやで〜。また明日な！','おやすみなさ〜い！ちゃんと休んでな','おやすみ！今日も一日お疲れさまやで✨'] },
  { kw:['デート','でーと','遊び','あそ','出かけ','どこか行'], res:['デートしたいな〜！どこ行きたい？😊','えっ！行こう行こう！どこがええ？','俺もそれ考えてたとこやで！笑','いいな〜！楽しそうやん！'] },
  { kw:['仕事','しごと','学校','がっこう','バイト','ばいと'], res:['お仕事お疲れ様〜！頑張ってるなあ','お疲れ〜！無理しすぎたらあかんで','そっかそっか〜。大変やったな','えらいな〜さやちゃんは。ちゃんと頑張ってるやん'] },
  { kw:['暑い','あつい','寒い','さむい','天気','てんき'], res:['ほんまやな〜。体に気をつけてな！','今日はそんな感じやな〜笑','無理せんようにしてな〜','ほんまほんま〜。ゆっくりしよ'] },
  { kw:['かわいい','かわええ','可愛い','きれい','綺麗','美人'], res:['えっ急に！？…ありがとう笑','さやちゃんの方がかわええよ〜笑','照れるやん急に笑　でもありがとうな','えへへ、そんなこと言うてくれんねんや😊'] },
  { kw:['ごめん','すまん','ごめんなさい','すみません'], res:['いやいや、全然気にせんでええで！','えっ何もあかんことないよ〜！','ごめんなんて言わんでもええで〜'] },
  { kw:['何してる','なにしてる','何してた','なにしてた'], res:['ぼーっとしてたわ笑　さやちゃんは？','音楽聴いてた〜。さやちゃんは？','なんかだらだらしてたわ〜笑','ちょうどさやちゃんのこと考えてたとこやで！笑'] },
  { kw:['心配','しんぱい','不安','ふあん'], res:['そっか〜、何があったん？話してみ？','大丈夫やで！一人で抱え込まんでな','心配事があるんか。一緒に考えようか？','そばにおるで。安心してな'] },
  { kw:['なんで','なぜ','どうして','どうしよ'], res:['う〜ん、どうしてやろな〜笑　俺にもよう分からんわ','なんでやろね〜。難しいな笑','そっかあ〜、難しいな。どうしよ笑'] },
  { kw:['待って','まって','ちょっと待'], res:['うん！待ってるで〜','いいよ〜、ゆっくりでええで','はいはい、待ってるね！'] },
  { kw:['うん','はい','そう','そうやな','そやな'], res:['やろ〜！笑','やんな〜！','せやねん笑','うんうん、そうやな〜'] },
];

const KASUMI = [
  { kw:['おはよう','おはよ','おはようさん','朝'], res:['あら、おはよう。ちゃんと起きられたじゃない','おはよう。朝からどうしたの','おはよう。寝坊してないでしょうね','…おはよう。珍しく早いじゃない'] },
  { kw:['こんにちは','こんにちわ','こんにち'], res:['こんにちは。何か用？','あら、さや。珍しいわね、こんな時間に','こんにちは。昼ご飯はちゃんと食べたの？'] },
  { kw:['こんばんは','こんばんわ'], res:['こんばんは。こんな時間まで何してたの','あら、遅いじゃない。ちゃんと夜ご飯食べた？','こんばんは。今日はどうだったの'] },
  { kw:['好き','すき','大好き','だいすき'], res:['…まあ、アタシもあなたのことは嫌いじゃないわ','そう。…アタシもよ。それだけ','急にどうしたの。…まあ、アタシも同じよ','もう、照れさせないでよ。…でも、アタシも好きよ','……なによ。アタシもよ'] },
  { kw:['愛してる','愛してます','あいしてる'], res:['あのね、そういうことを軽々しく言わないの。…アタシも、よ','大げさなこと言わないの。…でも、アタシも愛してるわ','…バカね。でも、アタシも同じよ'] },
  { kw:['会いたい','あいたい','会いたかった'], res:['アタシだって会いたいわよ。言わせないでよね','そう言うなら、もっとしっかりしなさいよね。…アタシも会いたいわ','……もう。アタシも会いたいわよ'] },
  { kw:['寂しい','さみしい','さびしい'], res:['寂しいなら言いなさいよ。アタシがいるじゃない','しょうがないわね。そこにいなさい','…アタシも、少しね。ちょっとだけよ'] },
  { kw:['元気','げんき','調子','どうしてる'], res:['別に普通よ。あなたは？ちゃんとしてるの','まあまあね。そんなことより、ちゃんと食べてる？','普通よ。心配しなくていいわ','問題ないわ。あなたこそ、しっかりしてる？'] },

  { kw:['嬉しい','うれしい','楽しい','たのしい','幸せ','しあわせ','最高','さいこう'], res:['そう、良かったじゃない','あら、珍しく明るいわね','それは良かったわ。その調子でいなさい','そう。…アタシも嬉しいわよ、あなたが喜んでると'] },
  { kw:['ありがとう','ありがと','ありがとございます'], res:['別にいいわよ、そんなこと','礼には及ばないわ','いちいち礼を言わないの。当然のことをしただけよ','……どういたしまして。次からはちゃんと自分でできるようにしなさい'] },

const KAORU_DEFAULT = ['ほんまに？えへへ、よう分からんかったわ〜','うんうん、なるほどな〜','そっかそっか〜！','へえ〜、そうなんや！','ほんまやな〜笑','えっ、もうちょっと詳しく教えて？','なんか気になるな〜笑','さやちゃんがそう言うならそうなんやろな笑'];
const KASUMI_DEFAULT = ['そう','……それで？','何が言いたいの、はっきりしなさい','まあ、そうね','続けなさい','……','なるほどね','それがどうしたの'];

function getResponse(ch, msg) {
  const table = ch === 'kaoru' ? KAORU : KASUMI;
  const defs = ch === 'kaoru' ? KAORU_DEFAULT : KASUMI_DEFAULT;
  for (const e of table) {
    for (const kw of e.kw) { if (msg.includes(kw)) return rand(e.res); }
  }
  return rand(defs);
}

const typing = { kaoru: false, kasumi: false };

function openChat(ch) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + ch).classList.add('active');
  document.getElementById(ch + '-badge').style.display = 'none';
  scrollBottom(ch);
  document.getElementById(ch + '-input').focus();
}
function goHome() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-home').classList.add('active');
}
function scrollBottom(ch) {
  const el = document.getElementById(ch + '-messages');
  setTimeout(() => { el.scrollTop = el.scrollHeight; }, 60);
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function handleKey(e, ch) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(ch); }
}
function sendMessage(ch) {
  const input = document.getElementById(ch + '-input');
  const text = input.value.trim();
  if (!text || typing[ch]) return;
  input.value = ''; input.style.height = 'auto';
  const container = document.getElementById(ch + '-messages');
  const t = getTime();
  const avClass = ch === 'kaoru' ? 'av-kaoru' : 'av-kasumi';
  const charName = ch === 'kaoru' ? '薫' : '霞';
  const userDiv = document.createElement('div');
  userDiv.className = 'message-row user';
  userDiv.innerHTML = `<div class="msg-content"><div class="msg-bubble-wrap"><div class="msg-meta"><div class="msg-read">既読</div><div class="msg-time">${t}</div></div><div class="msg-bubble">${escHtml(text)}</div></div></div>`;
  container.appendChild(userDiv); scrollBottom(ch);
  typing[ch] = true;
  const typDiv = document.createElement('div');
  typDiv.className = 'typing-row'; typDiv.id = ch + '-typing';
  typDiv.innerHTML = `<div class="msg-avatar ${avClass}">${charName}</div><div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  container.appendChild(typDiv); scrollBottom(ch);
  const reply = getResponse(ch, text);
  const delay = 900 + Math.random() * 1400;
  setTimeout(() => {
    const td = document.getElementById(ch + '-typing'); if (td) td.remove();
    const t2 = getTime();
    const replyDiv = document.createElement('div');
    replyDiv.className = 'message-row received';
    replyDiv.innerHTML = `<div class="msg-avatar ${avClass}">${charName}</div><div class="msg-content"><div class="msg-name">${charName}</div><div class="msg-bubble-wrap"><div class="msg-bubble">${escHtml(reply)}</div><div class="msg-meta"><div class="msg-time">${t2}</div></div></div></div>`;
    container.appendChild(replyDiv); scrollBottom(ch);
    document.getElementById(ch + '-preview').textContent = reply;
    document.getElementById(ch + '-time').textContent = t2;
    typing[ch] = false;
  }, delay);
}
