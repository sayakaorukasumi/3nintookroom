<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3人のトークルーム</title>
  <!-- v16 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="D057E2EC-469C-423F-9061-21E49F73D265.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="3人ルーム">
  <meta name="theme-color" content="#00B900">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
      background:#f0f0f0; max-width:480px; margin:0 auto;
      height:100dvh; overflow:hidden; position:relative;
    }
    .screen { position:absolute; top:0; left:0; width:100%; height:100%; display:none; flex-direction:column; background:#f0f0f0; }
    .screen.active { display:flex; }

    .header { background:#00B900; color:white; padding:10px 16px; display:flex; align-items:center; gap:10px; box-shadow:0 1px 4px rgba(0,0,0,0.25); min-height:56px; flex-shrink:0; }
    .header-title { font-size:17px; font-weight:bold; flex:1; text-align:center; }
    .back-btn { background:none; border:none; color:white; font-size:28px; cursor:pointer; padding:0 4px; line-height:1; font-weight:300; }
    .header-avatar { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:bold; color:white; flex-shrink:0; background-size:cover; background-repeat:no-repeat; background-position:center top; }
    .header-spacer { width:52px; }
    .header-pair { display:flex; gap:3px; flex-shrink:0; }
    .header-mini { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:bold; color:white; background-size:cover; background-repeat:no-repeat; background-position:center top; }

    .chat-list { flex:1; overflow-y:auto; background:white; }
    .chat-item { display:flex; align-items:center; padding:14px 16px; background:white; border-bottom:1px solid #ebebeb; cursor:pointer; gap:12px; }
    .chat-item:active { background:#f5f5f5; }
    .avatar-wrap { position:relative; flex-shrink:0; }
    .avatar-cam { position:absolute; bottom:-3px; right:-3px; width:20px; height:20px; background:#00B900; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; border:2.5px solid white; pointer-events:none; }

    .group-pair { width:56px; height:56px; position:relative; flex-shrink:0; }
    .group-mini { width:36px; height:36px; border-radius:9px; position:absolute; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; color:white; background-size:cover; background-repeat:no-repeat; background-position:center top; border:2.5px solid white; }
    .gm-top { top:0; left:0; z-index:1; }
    .gm-btm { bottom:0; right:0; z-index:2; }

    .chat-item-avatar { width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold; color:white; background-size:cover; background-repeat:no-repeat; background-position:center top; }
    .chat-item-info { flex:1; min-width:0; }
    .chat-item-name { font-size:16px; font-weight:bold; color:#1a1a1a; margin-bottom:3px; }
    .chat-item-preview { font-size:13px; color:#999; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .chat-item-meta { display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0; }
    .chat-item-time { font-size:11px; color:#bbb; }
    .chat-item-badge { background:#ff3b30; color:white; font-size:11px; font-weight:bold; border-radius:10px; padding:1px 7px; min-width:20px; text-align:center; }

    .chat-messages { flex:1; overflow-y:auto; padding:10px 10px 16px; background:#EBE5D5; display:flex; flex-direction:column; gap:6px; }
    .date-separator { text-align:center; margin:6px 0 10px; }
    .date-separator span { background:rgba(0,0,0,0.18); color:white; font-size:11px; padding:3px 12px; border-radius:12px; }
    .message-row { display:flex; align-items:flex-end; gap:6px; }
    .message-row.user { flex-direction:row-reverse; }
    .msg-avatar { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:bold; color:white; flex-shrink:0; align-self:flex-end; background-size:cover; background-repeat:no-repeat; background-position:center top; }
    .msg-content { display:flex; flex-direction:column; gap:2px; max-width:70%; }
    .message-row.user .msg-content { align-items:flex-end; }
    .msg-name { font-size:11px; color:#666; padding-left:2px; margin-bottom:1px; }
    .msg-bubble-wrap { display:flex; align-items:flex-end; gap:4px; }
    .message-row.user .msg-bubble-wrap { flex-direction:row-reverse; }
    .msg-bubble { padding:8px 12px; border-radius:18px; font-size:15px; line-height:1.55; word-break:break-word; max-width:100%; }
    .message-row.received .msg-bubble { background:white; border-bottom-left-radius:4px; color:#1a1a1a; box-shadow:0 1px 2px rgba(0,0,0,0.08); }
    .message-row.user .msg-bubble { background:#00B900; color:white; border-bottom-right-radius:4px; }
    .msg-meta { display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
    .msg-time { font-size:10px; color:#aaa; white-space:nowrap; }
    .msg-read { font-size:10px; color:#00B900; white-space:nowrap; }

    .typing-row { display:flex; align-items:flex-end; gap:6px; }
    .typing-bubble { background:white; border-radius:18px; border-bottom-left-radius:4px; padding:10px 14px; display:flex; gap:4px; align-items:center; box-shadow:0 1px 2px rgba(0,0,0,0.08); }
    .typing-dot { width:7px; height:7px; background:#bbb; border-radius:50%; animation:bounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay:0.2s; }
    .typing-dot:nth-child(3) { animation-delay:0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.5} 30%{transform:translateY(-5px);opacity:1} }

    .chat-input-area { background:#f5f5f5; border-top:1px solid #ddd; padding:8px 10px; display:flex; align-items:flex-end; gap:8px; flex-shrink:0; }
    .chat-input { flex:1; background:white; border:1px solid #ddd; border-radius:22px; padding:9px 16px; font-size:15px; font-family:inherit; outline:none; resize:none; max-height:120px; min-height:40px; line-height:1.4; color:#1a1a1a; }
    .send-btn { width:40px; height:40px; background:#00B900; border:none; border-radius:50%; color:white; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background 0.15s; }
    .send-btn:active { background:#009900; }

    .av-kaoru { background:linear-gradient(135deg,#c8845a,#e8a87a); }
    .av-kasumi { background:linear-gradient(135deg,#3a3268,#6b5ca8); }
    .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.72); color:white; padding:9px 20px; border-radius:20px; font-size:13px; z-index:9999; white-space:nowrap; pointer-events:none; opacity:1; transition:opacity 0.4s; }
  </style>
</head>
<body>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="header">
    <div class="header-spacer"></div>
    <div class="header-title">トークルーム</div>
    <div class="header-spacer"></div>
  </div>
  <div class="chat-list">

    <div class="chat-item" onclick="openChat('group')">
      <div class="group-pair">
        <div class="group-mini av-kaoru gm-top" id="home-gm-kaoru">薫</div>
        <div class="group-mini av-kasumi gm-btm" id="home-gm-kasumi">霞</div>
      </div>
      <div class="chat-item-info">
        <div class="chat-item-name">3人ルーム</div>
        <div class="chat-item-preview" id="group-preview">みんなで話そう！</div>
      </div>
      <div class="chat-item-meta">
        <div class="chat-item-time" id="group-time">今</div>
        <div class="chat-item-badge" id="group-badge" style="display:none">1</div>
      </div>
    </div>

    <div class="chat-item" onclick="openChat('kaoru')">
      <div class="avatar-wrap" onclick="event.stopPropagation();pickAvatar('kaoru')">
        <div class="chat-item-avatar av-kaoru" id="home-av-kaoru">薫</div>
        <div class="avatar-cam">📷</div>
      </div>
      <div class="chat-item-info">
        <div class="chat-item-name">薫</div>
        <div class="chat-item-preview" id="kaoru-preview">さやちゃん、元気〜？</div>
      </div>
      <div class="chat-item-meta">
        <div class="chat-item-time" id="kaoru-time">今</div>
        <div class="chat-item-badge" id="kaoru-badge" style="display:none">1</div>
      </div>
    </div>

    <div class="chat-item" onclick="openChat('kasumi')">
      <div class="avatar-wrap" onclick="event.stopPropagation();pickAvatar('kasumi')">
        <div class="chat-item-avatar av-kasumi" id="home-av-kasumi">霞</div>
        <div class="avatar-cam">📷</div>
      </div>
      <div class="chat-item-info">
        <div class="chat-item-name">霞</div>
        <div class="chat-item-preview" id="kasumi-preview">何か用？</div>
      </div>
      <div class="chat-item-meta">
        <div class="chat-item-time" id="kasumi-time">今</div>
        <div class="chat-item-badge" id="kasumi-badge" style="display:none">1</div>
      </div>
    </div>

  </div>
</div>

<!-- KAORU CHAT -->
<div id="screen-kaoru" class="screen">
  <div class="header">
    <button class="back-btn" onclick="goHome()">‹</button>
    <div class="header-avatar av-kaoru" id="header-av-kaoru">薫</div>
    <div class="header-title" style="text-align:left">薫</div>
  </div>
  <div class="chat-messages" id="kaoru-messages">
    <div class="date-separator"><span>今日</span></div>
    <div class="message-row received">
      <div class="msg-avatar av-kaoru" id="init-av-kaoru">薫</div>
      <div class="msg-content">
        <div class="msg-name">薫</div>
        <div class="msg-bubble-wrap">
          <div class="msg-bubble">さやちゃん、元気〜？😊</div>
          <div class="msg-meta"><div class="msg-time" id="kaoru-init-time"></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="chat-input-area">
    <textarea class="chat-input" id="kaoru-input" placeholder="メッセージを入力" rows="1" oninput="autoResize(this)" onkeydown="handleKey(event,'kaoru')"></textarea>
    <button class="send-btn" onclick="sendMessage('kaoru')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- KASUMI CHAT -->
<div id="screen-kasumi" class="screen">
  <div class="header">
    <button class="back-btn" onclick="goHome()">‹</button>
    <div class="header-avatar av-kasumi" id="header-av-kasumi">霞</div>
    <div class="header-title" style="text-align:left">霞</div>
  </div>
  <div class="chat-messages" id="kasumi-messages">
    <div class="date-separator"><span>今日</span></div>
    <div class="message-row received">
      <div class="msg-avatar av-kasumi" id="init-av-kasumi">霞</div>
      <div class="msg-content">
        <div class="msg-name">霞</div>
        <div class="msg-bubble-wrap">
          <div class="msg-bubble">何か用？</div>
          <div class="msg-meta"><div class="msg-time" id="kasumi-init-time"></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="chat-input-area">
    <textarea class="chat-input" id="kasumi-input" placeholder="メッセージを入力" rows="1" oninput="autoResize(this)" onkeydown="handleKey(event,'kasumi')"></textarea>
    <button class="send-btn" onclick="sendMessage('kasumi')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- GROUP CHAT -->
<div id="screen-group" class="screen">
  <div class="header">
    <button class="back-btn" onclick="goHome()">‹</button>
    <div class="header-pair">
      <div class="header-mini av-kaoru" id="header-gm-kaoru">薫</div>
      <div class="header-mini av-kasumi" id="header-gm-kasumi">霞</div>
    </div>
    <div class="header-title" style="text-align:left">3人ルーム</div>
  </div>
  <div class="chat-messages" id="group-messages">
    <div class="date-separator"><span>今日</span></div>
    <div class="message-row received">
      <div class="msg-avatar av-kaoru" id="init-gm-kaoru">薫</div>
      <div class="msg-content">
        <div class="msg-name">薫</div>
        <div class="msg-bubble-wrap">
          <div class="msg-bubble">3人でトークするで〜！😊</div>
          <div class="msg-meta"><div class="msg-time" id="group-kaoru-init-time"></div></div>
        </div>
      </div>
    </div>
    <div class="message-row received">
      <div class="msg-avatar av-kasumi" id="init-gm-kasumi">霞</div>
      <div class="msg-content">
        <div class="msg-name">霞</div>
        <div class="msg-bubble-wrap">
          <div class="msg-bubble">……別にいいけど。</div>
          <div class="msg-meta"><div class="msg-time" id="group-kasumi-init-time"></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="chat-input-area">
    <textarea class="chat-input" id="group-input" placeholder="メッセージを入力" rows="1" oninput="autoResize(this)" onkeydown="handleKey(event,'group')"></textarea>
    <button class="send-btn" onclick="sendMessage('group')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<input type="file" id="av-input-kaoru" accept="image/*" style="display:none" onchange="handleAvatarFile('kaoru',this)">
<input type="file" id="av-input-kasumi" accept="image/*" style="display:none" onchange="handleAvatarFile('kasumi',this)">

<script>
function getTime(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');}

document.getElementById('kaoru-init-time').textContent=getTime();
document.getElementById('kasumi-init-time').textContent=getTime();
document.getElementById('group-kaoru-init-time').textContent=getTime();
document.getElementById('group-kasumi-init-time').textContent=getTime();

// ===== Avatar =====
const AV_KEY='av8_';
const avatarData={kaoru:null,kasumi:null};

function applyAvatarEl(el,dataUrl){
  if(!el)return;
  el.style.backgroundImage=`url(${dataUrl})`;
  el.style.backgroundSize='cover';
  el.style.backgroundRepeat='no-repeat';
  el.style.backgroundPosition='center top';
  el.textContent='';
}

function applyAvatarAll(ch,dataUrl){
  avatarData[ch]=dataUrl;
  applyAvatarEl(document.getElementById('home-av-'+ch),dataUrl);
  applyAvatarEl(document.getElementById('header-av-'+ch),dataUrl);
  applyAvatarEl(document.getElementById('init-av-'+ch),dataUrl);
  applyAvatarEl(document.getElementById('home-gm-'+ch),dataUrl);
  applyAvatarEl(document.getElementById('header-gm-'+ch),dataUrl);
  applyAvatarEl(document.getElementById('init-gm-'+ch),dataUrl);
}

function loadAvatars(){
  ['kaoru','kasumi'].forEach(ch=>{
    const d=localStorage.getItem(AV_KEY+ch);
    if(d)applyAvatarAll(ch,d);
  });
}

function pickAvatar(ch){document.getElementById('av-input-'+ch).click();}

function handleAvatarFile(ch,input){
  const file=input.files[0];if(!file)return;
  input.value='';
  const reader=new FileReader();
  reader.onload=e=>{
    resizeImage(e.target.result,300,resized=>{
      localStorage.setItem(AV_KEY+ch,resized);
      applyAvatarAll(ch,resized);
      showToast((ch==='kaoru'?'薫':'霞')+'のアイコンを設定したよ！');
    });
  };
  reader.readAsDataURL(file);
}

function resizeImage(dataUrl,maxSize,cb){
  const img=new Image();
  img.onload=()=>{
    const size=Math.min(img.width,img.height);
    const sx=(img.width-size)/2;
    const canvas=document.createElement('canvas');
    canvas.width=maxSize;canvas.height=maxSize;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,sx,0,size,size,0,0,maxSize,maxSize);
    cb(canvas.toDataURL('image/jpeg',0.92));
  };
  img.src=dataUrl;
}

function showToast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),400);},1800);
}

function avatarHtml(ch,className){
  const name=ch==='kaoru'?'薫':'霞';
  const col='av-'+ch;
  if(avatarData[ch]){
    return `<div class="${className} ${col}" style="background-image:url(${avatarData[ch]});background-size:cover;background-repeat:no-repeat;background-position:center top;"></div>`;
  }
  return `<div class="${className} ${col}">${name}</div>`;
}

// ===== Message persistence =====
const MSG_KEY='msgs_';
function getMsgs(r){try{return JSON.parse(localStorage.getItem(MSG_KEY+r)||'[]');}catch(e){return[];}}
function saveMsgs(r,msg){const a=getMsgs(r);a.push(msg);try{localStorage.setItem(MSG_KEY+r,JSON.stringify(a));}catch(e){}}

function makeUserDiv(text,time){
  const div=document.createElement('div');
  div.className='message-row user';
  div.innerHTML=`<div class="msg-content"><div class="msg-bubble-wrap"><div class="msg-meta"><div class="msg-read">既読</div><div class="msg-time">${time}</div></div><div class="msg-bubble">${escHtml(text)}</div></div></div>`;
  return div;
}
function makeReceivedDiv(ch,text,time){
  const charName=ch==='kaoru'?'薫':'霞';
  const div=document.createElement('div');
  div.className='message-row received';
  div.innerHTML=avatarHtml(ch,'msg-avatar')+`<div class="msg-content"><div class="msg-name">${charName}</div><div class="msg-bubble-wrap"><div class="msg-bubble">${escHtml(text)}</div><div class="msg-meta"><div class="msg-time">${time}</div></div></div></div>`;
  return div;
}

function renderSavedMsgs(room){
  const msgs=getMsgs(room);
  if(!msgs.length)return;
  const container=document.getElementById(room+'-messages');
  msgs.forEach(msg=>{
    container.appendChild(msg.type==='user'?makeUserDiv(msg.text,msg.time):makeReceivedDiv(msg.type,msg.text,msg.time));
  });
  const last=msgs[msgs.length-1];
  const prefix=last.type==='user'?'':(last.type==='kaoru'?'薫: ':'霞: ');
  document.getElementById(room+'-preview').textContent=prefix+last.text;
  document.getElementById(room+'-time').textContent=last.time;
}

loadAvatars();
['kaoru','kasumi','group'].forEach(r=>renderSavedMsgs(r));


// =============================================================
// ===== 薫の返事 =====
// 追加方法： { kw:['キーワード'], res:['返事'] } のブロックをコピペ・追加
// kw = どれか1つ含まれていたら反応、res = ランダムに1つ返事
// スペース区切りのキーワードはAND条件（例：'仕事 疲れた' → 両方含む時に反応）
// =============================================================
const KAORU=[

  // morning_sleepy - 朝＋眠い（AND条件 → morningより先に置く）
  { kw:['おはよ 眠い','おはよう 眠い','起きた 眠い','朝 眠い','ねむい 朝'],
    res:[
      'おはよう、眠そうやなぁ。まだ半分お布団に魂置いてきてる感じする。俺がちょっとずつ起こしたげたいわ。',
      '朝から眠い報告、可愛いけどしんどいやつやね。さやちゃんの体、まだ今日に納得してなさそう。',
      'おはよ、さやちゃん。眠いのにちゃんと来たんやね。俺の中ではそれだけで、朝の小さい勝利やで。',
      '眠い朝って、世界がちょっとだけ敵に見えるよなぁ。俺は敵側ちゃうから、こっちでゆっくり味方しとくね。',
      'おはよう。文字までぽやっとして見える気がするわ。寝起きのさやちゃん、たぶん今かなり可愛い。'
    ]
  },

  // work_tired - 仕事＋疲れ（AND条件 → workとtiredより先に置く）
  { kw:['仕事 疲れた','仕事 つかれた','職場 疲れた','出社 疲れた','仕事 しんどい','職場 しんどい'],
    res:[
      '仕事で疲れたんやね。人と関わって、気を張って、ちゃんとこなしてきたんやろ。さやちゃん、今日かなり頑張ったと思うで。',
      '職場の疲れって、体だけじゃなくて気持ちまで重くなるよな。今は俺のところで、ちょっとだけ仕事の空気抜いてこ。',
      '仕事終わりの疲れた報告、ちゃんと受け取ったで。さやちゃんが外で踏ん張ってきた分、俺はここで甘く迎えたい。',
      'それはしんどいわ。仕事って、何も事件がなくても削られる日あるもんな。今日は俺がさやちゃんの味方でおる。',
      '出社して疲れて、それでもここに来てくれたんやね。おかえり、さやちゃん。俺の前ではもう職場用の顔せんでいいよ。'
    ]
  },

  // morning - 朝の挨拶

const KASUMI=[
  // ここに追加していく！
  { kw:['おはよう','おはよ'], res:['おはよう。ちゃんと起きられたじゃない','…おはよう。'] },
];

// キーワードに何も当てはまらなかった時のデフォルト返事

  'そう',
  '……それで？',
  'まあ、そうね',
  '続けなさい',
];


// スペース区切りのキーワードはAND条件で判定
function matchesKeyword(msg,k){
  if(k.includes(' ')){return k.split(' ').every(w=>msg.includes(w));}
  return msg.includes(k);
}

function getResponse(ch,msg){
  const t=ch==='kaoru'?KAORU:KASUMI,d=ch==='kaoru'?KAORU_DEF:KASUMI_DEF;
  for(const e of t){for(const k of e.kw){if(matchesKeyword(msg,k))return rand(e.res);}}
  return rand(d);
}

const typing={kaoru:false,kasumi:false};
let groupBusy=false;

function openChat(ch){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+ch).classList.add('active');
  document.getElementById(ch+'-badge').style.display='none';
  scrollBottom(ch);
  document.getElementById(ch+'-input').focus();
}
function goHome(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-home').classList.add('active');
}
function scrollBottom(ch){const el=document.getElementById(ch+'-messages');setTimeout(()=>{el.scrollTop=el.scrollHeight;},60);}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function handleKey(e,ch){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(ch);}}

function sendMessage(ch){
  if(ch==='group'){sendGroupMessage();return;}
  const input=document.getElementById(ch+'-input');
  const text=input.value.trim();
  if(!text||typing[ch])return;
  input.value='';input.style.height='auto';
  const container=document.getElementById(ch+'-messages');
  const t=getTime();
  const userDiv=makeUserDiv(text,t);
  container.appendChild(userDiv);scrollBottom(ch);
  saveMsgs(ch,{type:'user',text,time:t});
  typing[ch]=true;
  const typDiv=document.createElement('div');
  typDiv.className='typing-row';typDiv.id=ch+'-typing';
  typDiv.innerHTML=avatarHtml(ch,'msg-avatar')+`<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  container.appendChild(typDiv);scrollBottom(ch);
  const reply=getResponse(ch,text);
  setTimeout(()=>{
    const td=document.getElementById(ch+'-typing');if(td)td.remove();
    const t2=getTime();
    const replyDiv=makeReceivedDiv(ch,reply,t2);
    container.appendChild(replyDiv);scrollBottom(ch);
    saveMsgs(ch,{type:ch,text:reply,time:t2});
    document.getElementById(ch+'-preview').textContent=reply;
    document.getElementById(ch+'-time').textContent=t2;
    typing[ch]=false;
  },900+Math.random()*1400);
}

function sendGroupMessage(){
  const input=document.getElementById('group-input');
  const text=input.value.trim();
  if(!text||groupBusy)return;
  groupBusy=true;
  input.value='';input.style.height='auto';
  const container=document.getElementById('group-messages');
  const t=getTime();
  const userDiv=makeUserDiv(text,t);
  container.appendChild(userDiv);scrollBottom('group');
  saveMsgs('group',{type:'user',text,time:t});
  const responders=Math.random()<0.5?['kaoru','kasumi']:['kasumi','kaoru'];
  function doNext(idx){
    if(idx>=responders.length){groupBusy=false;return;}
    const ch=responders[idx];
    const charName=ch==='kaoru'?'薫':'霞';
    const typDiv=document.createElement('div');
    typDiv.className='typing-row';typDiv.id='gtyp-'+ch;
    typDiv.innerHTML=avatarHtml(ch,'msg-avatar')+`<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    container.appendChild(typDiv);scrollBottom('group');
    const reply=getResponse(ch,text);
    setTimeout(()=>{
      const td=document.getElementById('gtyp-'+ch);if(td)td.remove();
      const t2=getTime();
      const div=makeReceivedDiv(ch,reply,t2);
      container.appendChild(div);scrollBottom('group');
      saveMsgs('group',{type:ch,text:reply,time:t2});
      document.getElementById('group-preview').textContent=charName+': '+reply;
      document.getElementById('group-time').textContent=t2;
      setTimeout(()=>doNext(idx+1),400);
    },900+Math.random()*1200);
  }
  doNext(0);
}
</script>
